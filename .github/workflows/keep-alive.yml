# Render free 티어 슬립 방지 — /health 주기 호출
#
# 기본 URL은 현재 배포 백엔드입니다.
# 다른 서비스로 바꿀 때: GitHub Variables/Secrets 에 RENDER_HEALTH_URL 설정

name: Keep Render Alive

on:
  schedule:
    # UTC 기준. 약 10분마다 (Render idle ~15분 전에 깨움)
    - cron: "*/10 * * * *"
  workflow_dispatch: # 수동 실행용

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve health URL
        id: url
        env:
          FROM_VAR: ${{ vars.RENDER_HEALTH_URL }}
          FROM_SECRET: ${{ secrets.RENDER_HEALTH_URL }}
          DEFAULT_URL: https://food-recommend-ycf1.onrender.com/health
        run: |
          URL="${FROM_VAR:-$FROM_SECRET}"
          URL="${URL:-$DEFAULT_URL}"
          echo "value=$URL" >> "$GITHUB_OUTPUT"

      - name: Ping Render /health
        run: |
          set -e
          URL="${{ steps.url.outputs.value }}"
          echo "GET $URL"
          curl --fail --silent --show-error --max-time 30 \
            -H "User-Agent: nutripick-keep-alive" \
            "$URL"
          echo
          echo "OK"
