# Render Blueprint — 백엔드(Web Service)
# Dashboard에서 이미 만든 서비스(food-recommend-ycf1)가 있으면
# Root Directory / Start Command만 아래와 일치하는지 확인하세요.

services:
  - type: web
    name: food-recommend-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
